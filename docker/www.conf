[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
; Die before CloudFront's 30s origin read timeout so a pegged render cannot
; occupy a child until the ALB's 60s idle timeout. The 2026-09-18 outage was
; 1 vCPU at 100% for 20+ minutes; hung hire-va-4 workers starved redirects.
request_terminate_timeout = 25s
