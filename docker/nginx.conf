user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/font-woff
        image/svg+xml
        font/ttf
        font/otf;

    map $http_x_forwarded_proto $forwarded_https {
        default off;
        https   on;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/web;
        index index.php;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~* /\.(env|git|htaccess) {
            deny all;
        }

        location ~* \.(blade\.php)$ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120;
        }

        # Vite build output is content-hashed (e.g. app-Dd5Pzsc1.css) -- a new deploy
        # always gets new filenames, so these can be cached indefinitely with no
        # staleness risk.
        location ~* ^/app/themes/[^/]+/public/build/ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri /index.php?$args;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            expires 30d;
            access_log off;
            try_files $uri /index.php?$args;
        }
    }
}
