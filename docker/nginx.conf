user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/font-woff
        image/svg+xml
        font/ttf
        font/otf;

    map $http_x_rl_forwarded_proto $wp_forwarded_proto {
        default $http_x_forwarded_proto;
        https   https;
    }

    map $wp_forwarded_proto $forwarded_https {
        default off;
        https   on;
    }

    # Logged-out HTML cache. CloudFront honors the Cache-Control we set below.
    # Skip when PHP must run: editors, referral attribution, Livewire, admin.
    fastcgi_cache_path /var/cache/nginx/fastcgi
        levels=1:2
        keys_zone=WORDPRESS:50m
        inactive=10m
        max_size=200m
        use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    # 2s, not the 5s default. A stampede on /hire-va-4/ (two Livewire islands on
    # 1 vCPU) held the lock long enough that every other HTML miss — including
    # legacy 301s and the no-slash permalink — queued behind it and CloudFront
    # hit OriginReadTimeout (30s) with no first byte.
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 2s;
    fastcgi_cache_background_update on;

    map $request_method $skip_cache_method {
        default 0;
        POST    1;
        PUT     1;
        PATCH   1;
        DELETE  1;
    }

    map $http_cookie $skip_cache_cookie {
        default                 0;
        "~*wordpress_logged_in" 1;
        "~*wp-postpass"         1;
        "~*comment_author"      1;
    }

    map "$arg_ref$arg_via$arg_r" $skip_cache_ref {
        default 0;
        "~."    1;
    }

    map $request_uri $skip_cache_path {
        default              0;
        "~*^/healthz"        1;
        "~*wp-admin"         1;
        "~*wp-login\\.php"   1;
        "~*^/livewire"       1;
        "~*^/wp-json"        1;
        "~*xmlrpc\\.php"     1;
        "~*^/referrer-"      1;
        # The container's cron hits this every minute (docker/wp-cron.crontab). Without this
        # line it is a cacheable GET: `fastcgi_cache_valid 200 60s` against a 60s tick interval,
        # and `fastcgi_ignore_headers Cache-Control` below discards the no-cache WordPress sends
        # on it. Ticks would be served from the cache, PHP would never run, and the only symptom
        # would be scheduled jobs quietly not happening — X-RL-Cache: HIT on a URL whose entire
        # purpose is its side effects.
        "~*wp-cron\\.php"    1;
        # Renders per-lead hashed identifiers and a per-lead transaction_id for Google Ads
        # enhanced conversions (ConversionHooks::enhancedConversion). A shared cache entry would
        # hand one booker's data — and their transaction_id, which Google dedupes on — to every
        # other visitor inside the TTL, collapsing their conversions into one. The Set-Cookie
        # guard below would usually catch this via the session cookie, but only when the upstream
        # actually re-sends it; this does not depend on that.
        #
        # Unanchored on purpose, to match ConversionHooks::pathMatches() — that is a `stripos`
        # substring test, so a nested route like /x/vathankyou-b/ would render per-lead data too.
        # An anchored pattern here would have left exactly that case cached. Over-matching (a
        # query string carrying the word) only costs a cache entry and cannot leak anything.
        "~*vathankyou"       1;
        # One booking's calendar entry per ?id=. CloudFront keys pages without the query string,
        # so a cacheable response here would serve one person's meeting to whoever asked next.
        # Skipping also sends "private, no-store", which keeps it out of CloudFront.
        "~*^/scheduler-link" 1;
    }

    # CloudFront does not forward custom X-* viewer headers to this origin, so the
    # "X-Livewire: 1" header Livewire's client sends is gone by the time PHP sees the
    # request. Livewire 4.4's RequireLivewireHeaders guard reads that header and
    # abort(404)s without it, which 404s every booking-wizard step past the first.
    # Re-assert it here, scoped to the APP_KEY-hashed Livewire endpoint only.
    # TEMPORARY: remove once the /livewire-* cache behavior forwards all viewer headers.
    map $request_uri $rl_livewire_header {
        default          "";
        "~*^/livewire-"  "1";
    }

    map "$skip_cache_method$skip_cache_cookie$skip_cache_ref$skip_cache_path" $skip_cache {
        default 1;
        "0000"  0;
    }

    # Gates the trailing-slash canonicalisation in the server block below to reads.
    # A 301 does not carry a POST body across the hop, so applying that rewrite to a
    # write emptied every extensionless POST endpoint on the site: the MCP endpoint
    # answered "Parse error: Invalid JSON in request body" (an MCP client reports that
    # as no tools at all, which is how marketing hit it), and /api/webhooks/stripe,
    # /calendly and /slack/interactions 301'd to senders that do not follow redirects.
    # Introduced 2026-09-18 in 8f6cf91 and found the same day. Paths are excluded in
    # the rewrite itself as well — belt and braces, since a GET to /wp-json is still
    # an API call and has no permalink to canonicalise to.
    map $request_method $rl_slash_redirect {
        default "";
        GET     "1";
        HEAD    "1";
    }

    # Whether the upstream is handing this response a cookie.
    #
    # nginx itself already refuses to store such a response — Set-Cookie is not in
    # fastcgi_ignore_headers, so these always report X-RL-Cache: MISS. The bug this
    # guards is one level further out: the add_header below used to advertise
    # "public, s-maxage=60" on that same response, and CloudFront believed it. It
    # cached the Set-Cookie and handed every visitor in the TTL window the identical
    # laravel-session id. Because Laravel's referrer portal restores a login straight
    # from session('referrer_code') with no password re-check, and /referral-dashboard
    # renders that same view, a shared session is a shared login.
    #
    # Deliberately keyed on the response rather than on the request path. The previous
    # guard was a path list ("~*^/referrer-"), and this is precisely how it failed:
    # /referral-dashboard serves the portal but does not match that prefix, and
    # /book-consultation, /partners and /social-media-kit were never considered at all.
    # Any future route that opens a session is covered by this without an edit.
    #
    # On a cache HIT nginx does not talk to the upstream, so this is empty and the
    # response is marked cacheable — which is correct: a response nginx was allowed to
    # store never carried a cookie in the first place.
    map $upstream_http_set_cookie $has_set_cookie {
        default 0;
        "~."    1;
    }

    # `s-maxage` stays at 60s because NOTHING INVALIDATES THIS CACHE. There is no CloudFront
    # invalidation on deploy and no purge on publish (deployment.md documents invalidation as a
    # manual step for header changes only), so this number is the sole bound on how long an
    # editor's change takes to appear. Raising it requires adding a purge first.
    #
    # The stale windows are a different question, and the old 30s was far too small.
    #
    # Measured 2026-09-20 against production: `age` cycles 9 -> 69 under steady traffic, which is
    # proof CloudFront honours `stale-while-revalidate` here — 69 > s-maxage. But 60+30 means an
    # object idle for more than ~90s leaves the stale-serve window, and the next visitor pays a
    # blocking origin fetch. On this traffic profile that is common: ~45% of measured requests
    # took 400ms-1.9s TTFB, against ~200ms when served from the edge.
    #
    # `stale-while-revalidate=600` lets CloudFront answer instantly from cache after a quiet
    # spell and refresh in the background. It does NOT widen real staleness the way raising
    # `s-maxage` would: the first stale request triggers the revalidation, which completes in
    # seconds, so content is behind by one request rather than by the window. The window only
    # matters when revalidation keeps failing — which is precisely when serving stale is right.
    # 600s rather than a day so a persistently broken origin surfaces instead of being masked.
    #
    # `stale-if-error=86400` is the outage case: an origin 5xx serves the last good copy for a
    # day rather than handing visitors an error page. Nothing here depends on it in normal
    # operation.
    #
    # NOTE: this widens the window in which a visitor can be served content up to ~60s old. It
    # does not change the 60s freshness bound itself.
    map "$skip_cache$has_set_cookie" $html_cache_control {
        default "private, no-store";
        "00"    "public, s-maxage=60, stale-while-revalidate=600, stale-if-error=86400";
    }

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/web;
        index index.php;

        # Trailing slash for extensionless GET paths so /hire-va-4 and
        # /hire-va-4/ share one cache object. MUST stay in server context —
        # an `if`/`rewrite` inside `location /` next to `try_files` is the
        # nginx pitfall that 404'd every permalink on 2026-09-18 (homepage
        # still 200'd because `$uri/` is the docroot). Absolute https: the
        # origin connection is HTTP, so a relative `permanent` would emit
        # Location: http://remoteleverage.com/...
        # Skip /healthz: server-context rewrite runs before `location = /healthz`.
        # v-20260918-v8 301'd the ALB probe to /healthz/, ECS marked tasks
        # unhealthy (codes: [301]), and `aws ecs wait services-stable` never
        # returned — which is the "stuck" production deploy.
        # Skip /wp-json and /api: neither is a permalink, and both carry POSTs whose
        # bodies this 301 would drop. `if` is safe in this position — server context,
        # rewrite-module directive only; the pitfall in the note above is `if` sitting
        # next to `try_files` inside `location /`.
        # No `$is_args$args` in the replacement: `rewrite` appends the original query
        # string by itself, so naming it as well sent it twice. /x?gclid=A answered
        # Location: /x/?gclid=A?gclid=A, and PHP read gclid as "A?gclid=A" — a mangled
        # click id on every ad that lands without a trailing slash, from 41fd785
        # (v-20260918-v7) until 2026-09-24.
        if ($rl_slash_redirect) {
            rewrite ^/(?!livewire|healthz|wp-json|api/)([^.]+[^/])$ https://$http_host/$1/ permanent;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~* /\.(env|git|htaccess) {
            deny all;
        }

        location ~* \.(blade\.php)$ {
            deny all;
        }

        # Acorn's storage path lives at web/app/cache/, which is inside the Bedrock docroot,
        # so nginx would otherwise serve it as static files. `laravel.log` was publicly
        # readable on staging at /app/cache/acorn/logs/laravel.log — full request context,
        # lead email addresses, HubSpot contact ids and every logged stack trace, to anyone
        # who guessed the path. Compiled Blade views and the framework cache sit under the
        # same directory and are no more public.
        #
        # Denied here rather than moved because the path is load-bearing: entrypoint.sh
        # creates it and chowns it, and Acorn resolves storage_path() to it.
        location ~* ^/app/cache/ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https;
            fastcgi_param HTTP_X_FORWARDED_PROTO $wp_forwarded_proto;
            # if_not_empty is required: an empty-valued param would still satisfy
            # hasHeader('X-Livewire') and disable the guard on every request.
            fastcgi_param HTTP_X_LIVEWIRE $rl_livewire_header if_not_empty;
            # nginx's stock fastcgi_params does not forward the Authorization
            # header, so PHP never sees Basic credentials and every WordPress
            # Application Password request answers rest_not_logged_in. That is
            # what made Settings -> Environment Sync unable to reach staging.
            # CloudFront must also be told to forward Authorization to this origin.
            fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120;

            fastcgi_cache WORDPRESS;
            fastcgi_cache_valid 200 60s;
            fastcgi_cache_methods GET HEAD;
            fastcgi_cache_bypass $skip_cache_method $skip_cache_cookie $skip_cache_ref $skip_cache_path;
            fastcgi_no_cache $skip_cache_method $skip_cache_cookie $skip_cache_ref $skip_cache_path;
            # WordPress sends no-cache on HTML; ignore so logged-out pages can be stored.
            # Pragma is not a valid fastcgi_ignore_headers field (nginx will fail to start).
            fastcgi_ignore_headers Cache-Control Expires;
            fastcgi_hide_header Cache-Control;
            fastcgi_hide_header Expires;
            fastcgi_hide_header Pragma;

            add_header Cache-Control $html_cache_control always;
            add_header X-RL-Cache $upstream_cache_status always;
        }

        # Vite build output is content-hashed (e.g. app-Dd5Pzsc1.css) -- a new deploy
        # always gets new filenames, so these can be cached indefinitely with no
        # staleness risk.
        location ~* ^/app/themes/[^/]+/public/build/ {
            # One Cache-Control header, not two. `expires` emits its own `Cache-Control:
            # max-age`, so pairing it with add_header sent the header twice; the second
            # location below duplicated max-age outright, which RFC 9111 lets a cache treat
            # as stale. Expires itself is redundant: max-age overrides it everywhere.
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";

            # Hand compression to CloudFront for this directory only.
            #
            # CloudFront compresses an origin response only when it arrives uncompressed;
            # when the origin has already gzipped it, the edge passes the gzip straight
            # through. With `gzip on` inherited from the http block that is exactly what
            # happened, so a browser sending `gzip, deflate, br, zstd` got gzip — 42,984
            # bytes of app.css — even though the same object served as Brotli is 38,220
            # (-11%), on the request that blocks first render.
            #
            # Brotli at the origin would be better still, but nginx here is Debian
            # bookworm's package and ngx_brotli is not available for it (the Debian module
            # landed in trixie); compiling it into the deploy image is not worth 4.7 KB.
            #
            # Only the content-hashed build output is opted out. Everything else keeps
            # nginx gzip, so a request that bypasses the CDN is still compressed -- and for
            # this directory that is local docker over loopback, where it does not matter.
            gzip off;

            try_files $uri /index.php?$args;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri /index.php?$args;
        }
    }
}
