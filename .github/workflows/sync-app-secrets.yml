name: Sync app secrets

# GitHub does not emit an event when a secret value changes. Edit the
# staging/production environment secrets, then run this workflow (or deploy).
on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Environment whose secrets should be copied to Secrets Manager
        type: choice
        options:
          - staging
          - production
        default: staging
      restart_ecs:
        description: Force a new ECS deployment so running tasks pick up the new values
        type: boolean
        default: true

concurrency:
  group: sync-secrets-${{ inputs.github_environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    name: Sync ${{ inputs.github_environment }} secrets
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      APP_SECRET_ARN: ${{ vars.APP_SECRET_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push GitHub secrets to Secrets Manager
        env:
          GITHUB_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python3 scripts/sync-app-secrets-from-env.py

      - name: Restart ECS tasks
        if: ${{ inputs.restart_ecs && env.ECS_CLUSTER != '' && env.ECS_SERVICE != '' }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
