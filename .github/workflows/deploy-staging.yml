name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::742621604050:role/wordpress-staging-github-actions' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'wordpress-staging' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'wordpress-staging' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'wordpress-staging' }}
  IMAGE_TAG: staging

jobs:
  ci:
    name: Quality gates
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
        run: |
          python3 -c 'import json,os,sys; json.dump({"http-basic":{"connect.advancedcustomfields.com":{"username":os.environ["ACF_PRO_KEY"],"password":"https://remoteleverage.com"}}}, sys.stdout)' > "$RUNNER_TEMP/composer-auth.json"
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --secret id=composer_auth,src="$RUNNER_TEMP/composer-auth.json" \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:${GITHUB_SHA}" \
            .
          rm -f "$RUNNER_TEMP/composer-auth.json"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

  notify:
    name: Slack
    if: ${{ always() && !cancelled() }}
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Notify Slack
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ (needs.ci.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
          title: Staging deploy
          details: ci=${{ needs.ci.result }}, deploy=${{ needs.deploy.result }}
          github-user: ${{ github.event.head_commit.author.username || github.actor }}
          author-email: ${{ github.event.head_commit.author.email || github.event.pusher.email }}
          author-name: ${{ github.event.head_commit.author.name || github.actor }}
          subject: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          pr-url: ${{ github.event.pull_request.html_url }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CI_CHANNEL_ID || secrets.SLACK_CHANNEL_ID }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          user-map-json: ${{ vars.SLACK_GITHUB_USER_MAP }}
