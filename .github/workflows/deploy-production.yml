name: Deploy production

on:
  push:
    tags:
      - "v-????????-v1"
      - "v-????????-v2"
      - "v-????????-v3"
      - "v-????????-v4"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'wordpress-production' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'wordpress-production' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'wordpress-production' }}
  RELEASE_TAG: ${{ github.ref_name }}
  IMAGE_TAG: production

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require v-YYYYMMDD-v{1,2,3,4}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v-[0-9]{8}-v[1-4]$ ]]; then
            echo "Tag '$RELEASE_TAG' does not match v-YYYYMMDD-v{1,2,3,4} (e.g. v-20260916-v1)"
            exit 1
          fi
          echo "Deploying $RELEASE_TAG"

  ci:
    name: Quality gates
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://production.remoteleverage.com
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
        run: |
          python3 -c 'import json,os,sys; json.dump({"http-basic":{"connect.advancedcustomfields.com":{"username":os.environ["ACF_PRO_KEY"],"password":"https://remoteleverage.com"}}}, sys.stdout)' > "$RUNNER_TEMP/composer-auth.json"
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --secret id=composer_auth,src="$RUNNER_TEMP/composer-auth.json" \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --tag "$IMAGE:${GITHUB_SHA}" \
            .
          rm -f "$RUNNER_TEMP/composer-auth.json"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
