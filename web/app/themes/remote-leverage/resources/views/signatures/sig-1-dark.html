<table cellpadding="0" cellspacing="0" border="0" style="background-color: #25104A; width: 600px; height: 200px; min-width: 600px; max-width: 600px; font-family: Helvetica, Arial, sans-serif; text-align: left; border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
    <tr>
        <!-- Left Dome Section -->
        <td valign="middle" align="center" bgcolor="#8A2BE2" width="163" style="width: 163px; background-color: #8A2BE2; border-top-right-radius: 100px; border-bottom-right-radius: 100px; text-align: center; vertical-align: middle; padding: 0;">
            <img src="{{LOGO_ICON_WHITE}}" width="110" height="110" alt="Brand Icon" style="display: block; margin: 0 auto; border: 0;" />
        </td>
        
        <!-- Right Info Section -->
        <td valign="top" style="padding: 24px 28px 24px 28px; vertical-align: top;">
            <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; height: 152px; border-collapse: collapse;">
                <tr>
                    <!-- Left-middle Column: Identity & Socials -->
                    <td valign="top" style="width: 210px; vertical-align: top; padding: 0;">
                        <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; height: 152px; border-collapse: collapse;">
                            <tr>
                                <td valign="top" style="vertical-align: top; padding: 0;">
                                    <div style="font-size: 20px; font-weight: bold; color: #FFFFFF; line-height: 1.2; font-family: Helvetica, Arial, sans-serif; letter-spacing: -0.5px;">{{NAME}}</div>
                                    <div style="font-size: 14px; color: #DCE3EB; font-weight: normal; margin-top: 4px; font-family: Helvetica, Arial, sans-serif;">{{TITLE}}</div>
                                </td>
                            </tr>
                            <tr>
                                <td valign="bottom" style="vertical-align: bottom; padding: 0; height: 30px;">
                                    <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px; border-collapse: collapse;">
                                        <tr>
                                            {{SOCIAL_CELLS}}
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                    
                    <!-- Middle Spacer -->
                    <td style="width: 20px; padding: 0;"></td>
                    
                    <!-- Right-middle Column: Contact Info & Brand Logo -->
                    <td valign="top" style="vertical-align: top; padding: 0;">
                        <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; height: 152px; border-collapse: collapse;">
                            <tr>
                                <td valign="top" style="vertical-align: top; padding: 0; font-size: 10px; line-height: 1.35; color: #DCE3EB; font-family: Helvetica, Arial, sans-serif;">
                                    <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-size: 10px; line-height: 1.35; color: #DCE3EB;">
                                        <tr>
                                            <td style="font-weight: bold; color: #FFFFFF; padding-bottom: 2px; font-family: Helvetica, Arial, sans-serif;">Address</td>
                                        </tr>
                                        <tr>
                                            <td style="padding-bottom: 2px; color: #DCE3EB; font-family: Helvetica, Arial, sans-serif; white-space: nowrap;">{{ADDRESS_LINE1}}</td>
                                        </tr>
                                        <tr>
                                            <td style="padding-bottom: 2px; color: #DCE3EB; font-family: Helvetica, Arial, sans-serif; white-space: nowrap;">{{ADDRESS_LINE2}}</td>
                                        </tr>
                                        {{PHONE_ROW}}
                                        {{MOBILE_ROW}}
                                        <tr>
                                            <td style="padding-bottom: 2px; font-family: Helvetica, Arial, sans-serif;"><a href="mailto:{{EMAIL}}" style="color: #DCE3EB; text-decoration: none;">{{EMAIL}}</a></td>
                                        </tr>
                                        <tr>
                                            <td style="padding-bottom: 0; font-family: Helvetica, Arial, sans-serif;"><a href="{{WEBSITE}}" target="_blank" style="color: #FFFFFF; text-decoration: none; font-weight: bold;">{{WEBSITE_DISPLAY}}</a></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td valign="bottom" style="vertical-align: bottom; padding: 0; height: 35px;">
                                    <img src="{{LOGO_URL}}" height="28" alt="Remote Leverage" style="display: block; border: 0; margin: 0; width: auto;" />
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
